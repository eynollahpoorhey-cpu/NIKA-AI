name: Build NIKA AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Prepare protected release signing key
        if: ${{ secrets.NIKA_KEYSTORE_BASE64 != '' && secrets.NIKA_KEYSTORE_PASSWORD != '' && secrets.NIKA_KEY_ALIAS != '' && secrets.NIKA_KEY_PASSWORD != '' }}
        env:
          NIKA_KEYSTORE_BASE64: ${{ secrets.NIKA_KEYSTORE_BASE64 }}
          NIKA_KEYSTORE_PASSWORD: ${{ secrets.NIKA_KEYSTORE_PASSWORD }}
          NIKA_KEY_ALIAS: ${{ secrets.NIKA_KEY_ALIAS }}
          NIKA_KEY_PASSWORD: ${{ secrets.NIKA_KEY_PASSWORD }}
        run: |
          echo "$NIKA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nika-release.jks"
          echo "NIKA_KEYSTORE_PATH=$RUNNER_TEMP/nika-release.jks" >> "$GITHUB_ENV"
          echo "NIKA_KEYSTORE_PASSWORD=$NIKA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NIKA_KEY_ALIAS=$NIKA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NIKA_KEY_PASSWORD=$NIKA_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.NIKA_KEYSTORE_PATH != '' }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        if: ${{ env.NIKA_KEYSTORE_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-AI-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
